<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Prompt Studio</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">LOCAL IMAGE WORKBENCH</p><h1>提示词工作台</h1><p class="sub">用 GPT-5.6 Sol 整理想法，再交给 GPT Image 2.5 生成。</p></div><span class="status"><i></i>本地运行</span></header>
<section class="workspace"><aside class="panel controls"><div class="step"><span>01</span><div><h2>输入与润色</h2><p>把想法写下来，参考图可选。</p></div></div>
<label>润色 API Key <input id="refineKey" type="password" placeholder="sk-..." autocomplete="off"></label>
<label>生图 API Key <input id="imageKey" type="password" placeholder="sk-..." autocomplete="off"></label>
<label>原始提示词 <textarea id="prompt" rows="5" placeholder="例如：一只戴宇航员头盔的橘猫贴纸"></textarea></label>
<label class="upload">参考图 <input id="reference" type="file" accept="image/png,image/jpeg,image/webp"><span id="fileName">未选择文件</span></label>
<div class="row"><label>模型<select id="model"><option value="gpt-image-2.5-sunburst">2.5 Sunburst</option><option value="gpt-image-2.5-flare">2.5 Flare</option></select></label><label>尺寸<select id="size"><option>1024x1024</option><option>1536x1024</option><option>1024x1536</option></select></label></div>
<div class="actions"><button id="refine" class="secondary">✦ 润色提示词</button><button id="generate" class="primary">生成图片 <span>→</span></button></div><p id="message" class="message"></p></aside>
<section class="panel result"><div class="step"><span>02</span><div><h2>生成结果</h2><p id="resultMeta">等待你的提示词</p></div></div><div id="empty" class="empty"><div class="emptyIcon">✧</div><h3>图片会出现在这里</h3><p>先润色提示词，或直接生成。</p></div><div id="output" class="output hidden"><img id="resultImage" alt="生成结果"><div class="resultBar"><span id="usedPrompt"></span><a id="download" class="download" download="generated-image.jpg">下载图片 ↓</a></div></div></section></section>
<footer>API 请求通过本机代理发送，密钥不会写入文件。</footer></main><script src="/app.js"></script></body></html>
