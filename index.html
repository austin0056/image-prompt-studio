<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Prompt Studio</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">LOCAL IMAGE WORKBENCH</p><h1>提示词工作台</h1><p class="sub">用 GPT-5.6 Sol 整理想法，再交给 GPT Image 2.5 生成。</p></div><span class="status"><i></i>本地运行</span></header>
<section class="workspace"><aside class="panel controls"><div class="step"><span>01</span><div><h2>输入与润色</h2><p>把想法写下来，参考图可选。</p></div></div>
<label>润色 API Key <input id="refineKey" type="password" placeholder="已配置，可留空" autocomplete="off"></label>
<label>生图 API Key <input id="imageKey" type="password" placeholder="已配置，可留空" autocomplete="off"></label>
<label>原始提示词 <textarea id="prompt" rows="5" placeholder="例如：一只戴宇航员头盔的橘猫贴纸"></textarea></label>
<label class="upload">参考图 <input id="reference" type="file" accept="image/png,image/jpeg,image/webp,image/mpo,.mpo"><span id="fileName">未选择文件</span></label><div id="referencePreviewWrap" class="referencePreviewWrap hidden"><img id="referencePreview" class="referencePreview" alt="参考图预览"></div>
<div class="row"><label>模型<select id="model"><option value="gpt-image-2.5-sunburst">gpt-image-2.5-sunburst</option></select></label><label>比例与清晰度<select id="size"><option value="1024x1024">1:1 正方形（1K · 1024 × 1024）</option><option value="1536x1024">3:2 横向（1K · 1536 × 1024）</option><option value="1024x1536">2:3 纵向（1K · 1024 × 1536）</option><option value="2048x2048">1:1 正方形（2K · 2048 × 2048）</option><option value="4096x4096">1:1 正方形（4K · 4096 × 4096）</option></select></label></div>
<label>生成数量<select id="quantity"><option value="1">1 张</option><option value="2">2 张</option><option value="4">4 张</option></select></label>
<div class="actions"><button id="refine" class="secondary">✦ 润色提示词</button><button id="generate" class="primary">生成图片 <span>→</span></button></div><p id="message" class="message"></p></aside>
<section class="panel result"><div class="step"><span>02</span><div><h2>生成队列</h2><p id="queueSummary">0 个任务</p></div><button id="clearQueue" class="queueClear" type="button">清空已完成</button></div><div id="queueList" class="queueList"><p class="queueEmpty">暂无任务</p></div></section></section>
<div id="previewModal" class="previewModal hidden" role="dialog" aria-modal="true" aria-label="图片预览"><div class="previewDialog"><button id="closePreview" class="previewClose" type="button" aria-label="关闭预览">×</button><img id="previewImage" alt="生成图片预览"><div class="previewFooter"><span id="previewPrompt"></span><a id="previewDownload" class="download" download="generated-image.png">下载图片 ↓</a></div></div></div>
<footer>API 请求通过本机代理发送，密钥不会写入文件。</footer></main><script src="/app.js"></script></body></html>
